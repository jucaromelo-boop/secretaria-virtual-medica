services:

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8091:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - consultorio-net

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: discovery-server
    ports:
      - "8761:8761"
    networks:
      - consultorio-net

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: config-server
    depends_on:
      - discovery-server
    networks:
      - consultorio-net

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: api-gateway
    depends_on:
      - discovery-server
      - config-server
    networks:
      - consultorio-net

  ms-citas:
    build:
      context: .
      dockerfile: ms-citas/Dockerfile
    container_name: ms-citas
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-citas
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DB_HOST: postgres
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/certs
      KAFKA_HOST: kafka
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/token
    depends_on:
      - discovery-server
      - config-server
      - kafka
      - postgres
    networks:
      - consultorio-net

  ms-pacientes:
    build:
      context: .
      dockerfile: ms-pacientes/Dockerfile
    container_name: ms-pacientes
    ports:
      - "8082:8082"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-pacientes
      DB_HOST: postgres
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/certs
      keycloak:
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/token
    depends_on:
      - discovery-server
      - config-server
      - postgres
    networks:
      - consultorio-net

  ms-medicos:
    build:
      context: .
      dockerfile: ms-medicos/Dockerfile
    container_name: ms-medicos
    ports:
      - "8083:8083"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-medicos
      DB_HOST: postgres
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/token
    depends_on:
        - discovery-server
        - config-server
        - postgres
    networks:
      - consultorio-net

  ms-notificaciones:
    build:
      context: .
      dockerfile: ms-notificaciones/Dockerfile
    container_name: ms-notificaciones
    ports:
      - "8084:8084"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-notificaciones
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/certs
      KAFKA_HOST: kafka
      DB_HOST: postgres
    depends_on:
      - discovery-server
      - config-server
      - kafka
      - postgres
    networks:
      - consultorio-net

  ms-orquestador-ia:
    build:
      context: .
      dockerfile: ms-orquestador-ia/Dockerfile
    container_name: ms-orquestador-ia
    ports:
      - "8086:8086"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-orquestador-ia
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/consultorio/protocol/openid-connect/token
    depends_on:
      - discovery-server
      - config-server
      - keycloak
    networks:
      - consultorio-net

  ms-canal-whatsapp:
    build:
      context: .
      dockerfile: ms-canal-whatsapp/Dockerfile
    container_name: ms-canal-whatsapp
    ports:
      - "8085:8085"
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: ms-canal-whatsapp
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      TWILIO_WEBHOOK_PUBLIC_URL: ${TWILIO_WEBHOOK_PUBLIC_URL}
    depends_on:
      - discovery-server
      - config-server
    networks:
      - consultorio-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:SASL_PLAINTEXT,PLAINTEXT_HOST:SASL_PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf"
    volumes:
      - ./kafka-config/kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
    networks:
      - consultorio-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - consultorio-net

networks:
  consultorio-net:
    driver: bridge



volumes:
  postgres_data:
  keycloak_data: