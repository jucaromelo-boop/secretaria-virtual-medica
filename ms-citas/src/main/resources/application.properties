spring.application.name=ms-citas
spring.config.import=optional:configserver:http://localhost:8888

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/citas_db
spring.datasource.username=db_user_citas
spring.datasource.password=citas_pass_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.bootstrap-servers=${KAFKA_HOST:localhost}:9092
spring.kafka.security.protocol=SASL_PLAINTEXT
spring.kafka.properties.sasl.mechanism=PLAIN
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="citas" password="citas-secret-dev";

resilience4j.circuitbreaker.instances.pacientesService.sliding-window-size=5
resilience4j.circuitbreaker.instances.pacientesService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pacientesService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pacientesService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.medicoService.sliding-window-size=5
resilience4j.circuitbreaker.instances.medicoService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.medicoService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.medicoService.permitted-number-of-calls-in-half-open-state=3

resilience4j.timelimiter.instances.pacientesService.timeout-duration=3s
resilience4j.timelimiter.instances.medicoService.timeout-duration=3s

keycloak.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8091/realms/consultorio/protocol/openid-connect/certs}

keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8091/realms/consultorio/protocol/openid-connect/token}
keycloak.service-client-id=internal-services
keycloak.service-client-secret=YMXbNcdk2fi67dFJRhkzIfMeDHnFaFiV

management.endpoint.health.show-details=never
management.endpoints.web.exposure.include=health

