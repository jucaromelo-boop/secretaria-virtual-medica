spring.application.name=ms-citas
spring.config.import=optional:configserver:http://localhost:8888

server.port=8081

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.datasource.url=jdbc:postgresql://localhost:5432/citas_db
spring.datasource.username=db_user_citas
spring.datasource.password=citas_pass_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

resilience4j.circuitbreaker.instances.pacientesService.sliding-window-size=5
resilience4j.circuitbreaker.instances.pacientesService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pacientesService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.pacientesService.permitted-number-of-calls-in-half-open-state=3

resilience4j.circuitbreaker.instances.medicoService.sliding-window-size=5
resilience4j.circuitbreaker.instances.medicoService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.medicoService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.medicoService.permitted-number-of-calls-in-half-open-state=3

resilience4j.timelimiter.instances.pacientesService.timeout-duration=3s
resilience4j.timelimiter.instances.medicoService.timeout-duration=3s

keycloak.jwk-set-uri=http://localhost:8091/realms/consultorio/protocol/openid-connect/certs

keycloak.token-uri=http://localhost:8091/realms/consultorio/protocol/openid-connect/token
keycloak.service-client-id=internal-services
