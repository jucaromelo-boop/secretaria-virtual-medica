spring.application.name=ms-medicos
spring.config.import=optional:configserver:http://localhost:8888

server.port=8083

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:postgresql://localhost:5432/medicos_db
spring.datasource.username=db_user_medicos
spring.datasource.password=medicos_pass_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

keycloak.jwk-set-uri=http://localhost:8091/realms/consultorio/protocol/openid-connect/certs