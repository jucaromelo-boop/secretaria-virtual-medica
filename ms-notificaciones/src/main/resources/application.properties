spring.application.name=ms-notificaciones
spring.config.import=optional:configserver:http://localhost:8888

server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ms-notificaciones-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.consultorio.notificaciones.event.CitaEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

management.endpoints.web.exposure.include=health,info

recordatorios.horas-anticipacion=24
recordatorios.ventana-minutos=60
recordatorios.cron=0 0 * * * *

spring.datasource.url=jdbc:postgresql://localhost:5432/notificaciones_db
spring.datasource.username=db_user_notificaciones
spring.datasource.password=notificaciones_pass_dev
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

keycloak.jwk-set-uri=http://localhost:8091/realms/consultorio/protocol/openid-connect/certs